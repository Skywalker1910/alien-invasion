<!doctype html>
<!--
  Minimal example of a host page for the Pygbag build of Alien Invasion.

  1. python build_web.py
  2. copy build/web/ next to this file as game/
  3. serve the folder (python -m http.server) and open host-example.html

  The host owns everything outside the game: player names, country,
  the public leaderboard, analytics. The game only reports events.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alien Invasion Host Example</title>
  <style>
    body { margin: 0; background: #080a18; color: #e8ecff; font: 14px system-ui, sans-serif; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
    .game { position: relative; width: 100%; aspect-ratio: 3 / 2; }
    .game iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .hud { display: flex; gap: 16px; margin: 8px 0; }
    .pad { display: flex; gap: 8px; margin-top: 8px; }
    .pad button { flex: 1; padding: 16px; font-size: 18px; touch-action: none; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="game"><iframe id="game" src="game/index.html" allow="autoplay; fullscreen"></iframe></div>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Level: <b id="level">-</b></span>
    <span>Health: <b id="health">-</b></span>
    <span>Ships: <b id="lives">-</b></span>
    <button id="start" disabled>Start</button>
    <button id="pause">Pause</button>
  </div>
  <!-- Optional on-screen controls for touch devices -->
  <div class="pad">
    <button data-btn="left">◀</button>
    <button data-btn="up">▲</button>
    <button data-btn="down">▼</button>
    <button data-btn="right">▶</button>
    <button data-btn="fire">FIRE</button>
    <button id="special">SHOCK</button>
    <button id="prev">◁ WPN</button>
    <button id="next">WPN ▷</button>
  </div>
</div>
<script>
  const frame = document.getElementById("game");
  // Use the game's real origin instead of "*" once it is deployed.
  const send = (cmd) => frame.contentWindow.postMessage({ target: "alien-invasion", ...cmd }, "*");

  window.addEventListener("message", (e) => {
    if (e.source !== frame.contentWindow) return;
    const ev = e.data;
    if (!ev || ev.source !== "alien-invasion") return;
    switch (ev.type) {
      case "ready":
        document.getElementById("start").disabled = false;
        break;
      case "state":
        document.getElementById("score").textContent = ev.score;
        document.getElementById("level").textContent = ev.level;
        document.getElementById("health").textContent = ev.health;
        document.getElementById("lives").textContent = ev.lives;
        break;
      case "score_saved":
        // The player saved a run to the game's local leaderboard (name +
        // country flag). Submit it to your own global leaderboard here if
        // you have one; the game never makes network calls itself.
        console.log("score saved", ev);
        break;
    }
  });

  document.getElementById("start").onclick = () => send({ type: "start" });
  let paused = false;
  document.getElementById("pause").onclick = () => {
    paused = !paused;
    send({ type: paused ? "pause" : "resume" });
  };
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { paused = true; send({ type: "pause" }); }
  });

  const held = { left: false, right: false, up: false, down: false, fire: false };
  for (const btn of document.querySelectorAll("[data-btn]")) {
    const name = btn.dataset.btn;
    const set = (down) => (e) => { e.preventDefault(); held[name] = down; send({ type: "input", ...held }); };
    btn.addEventListener("pointerdown", set(true));
    btn.addEventListener("pointerup", set(false));
    btn.addEventListener("pointerleave", set(false));
    btn.addEventListener("pointercancel", set(false));
  }
  document.getElementById("special").onclick = () => send({ type: "special" });
  document.getElementById("prev").onclick = () => send({ type: "switch", direction: -1 });
  document.getElementById("next").onclick = () => send({ type: "switch", direction: 1 });
</script>
</body>
</html>
